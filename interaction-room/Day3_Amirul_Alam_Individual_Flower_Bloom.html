<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bloom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500;600&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #070a0d;
            font-family: 'Inter', sans-serif;
            color: #f1f5f9;
            cursor: none; /* Hide default cursor to render custom bioluminescent orb */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .fade-smooth {
            transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glow-title {
            text-shadow: 0 0 25px rgba(244, 114, 182, 0.35), 0 0 50px rgba(192, 132, 252, 0.2);
        }

        .glow-sub {
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-[#070a0d] text-slate-100">

    <!-- Primary Canvas for Garden Rendering -->
    <canvas id="gardenCanvas"></canvas>

    <!-- Intro Overlay Message -->
    <div class="ui-overlay">
        <div id="introCard" class="flex flex-col items-center text-center px-6 max-w-lg fade-smooth opacity-100 transform scale-100">
            <div class="text-3xl md:text-5xl font-light tracking-[0.2em] text-pink-200 font-['Cinzel'] glow-title mb-2 uppercase flex items-center justify-center gap-3">
                <span>🌸</span> <span>Bloom</span>
            </div>
            
            <p class="text-xs md:text-sm font-extralight tracking-[0.3em] uppercase text-purple-200/90 glow-sub mb-6">
                The one lesson
            </p>

            <h2 class="text-lg md:text-2xl font-light tracking-widest text-slate-100 italic mb-6">
                “Gentleness creates life.”
            </h2>

            <div class="flex flex-col space-y-2 text-xs md:text-sm font-extralight tracking-widest text-slate-300/80 font-mono">
                <p class="text-emerald-300/90">Move slowly to grow.</p>
                <p class="text-purple-300/90">Stay still to bloom.</p>
                <p class="text-rose-300/80">Move fast and nature scatters.</p>
            </div>
        </div>

        <!-- Inactivity / Ending Message -->
        <div id="endingCard" class="absolute bottom-12 flex flex-col items-center text-center px-6 fade-smooth opacity-0 transform translate-y-4">
            <p class="text-sm md:text-base font-extralight tracking-[0.3em] text-emerald-200/90 font-['Cinzel'] glow-sub uppercase">
                The garden remembers kindness.
            </p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gardenCanvas');
        const ctx = canvas.getContext('2d');

        const introCard = document.getElementById('introCard');
        const endingCard = document.getElementById('endingCard');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Interactive Mouse / Touch Tracking
        const mouse = {
            x: width / 2,
            y: height / 2,
            targetX: width / 2,
            targetY: height / 2,
            px: width / 2,
            py: height / 2,
            vx: 0,
            vy: 0,
            speed: 0,
            dwellX: width / 2,
            dwellY: height / 2,
            dwellTime: 0,
            lastMoveTime: performance.now(),
            hasStarted: false
        };

        // Environment Wind & Physical Force State
        const wind = { x: 0, targetX: 0, force: 0 };

        // Web Audio Synthesizer Context for Gentle Bloom Chimes
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playChime() {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                // Harmonic Pentatonic Frequencies (F# Major)
                const freqs = [369.99, 466.16, 554.37, 739.99, 932.33, 1108.73];
                const note = freqs[Math.floor(Math.random() * freqs.length)];

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(note, now);

                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.03, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 2.8);
            } catch (e) {
                // Ignore audio policy restrictions gracefully
            }
        }

        const PALETTES = [
            { name: 'pink', primary: '#f472b6', secondary: '#fbcfe8', glow: 'rgba(244, 114, 182, 0.4)' },
            { name: 'lavender', primary: '#c084fc', secondary: '#e9d5ff', glow: 'rgba(192, 132, 252, 0.4)' },
            { name: 'yellow', primary: '#facc15', secondary: '#fef08a', glow: 'rgba(250, 204, 21, 0.4)' },
            { name: 'white', primary: '#f8fafc', secondary: '#ffffff', glow: 'rgba(248, 250, 252, 0.5)' },
            { name: 'light blue', primary: '#38bdf8', secondary: '#bae6fd', glow: 'rgba(56, 189, 248, 0.4)' }
        ];

        const flowers = [];
        const seeds = [];
        const grassBlades = [];
        const butterflies = [];
        const petals = [];
        const dustParticles = [];
        const fireflies = [];
        const cursorParticles = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initBackgroundElements();
        }
        window.addEventListener('resize', resizeCanvas);

        function updatePointer(x, y) {
            initAudio();
            mouse.hasStarted = true;

            // Smooth interpolation targets
            mouse.targetX = x;
            mouse.targetY = y;

            const now = performance.now();
            mouse.lastMoveTime = now;

            // Hide intro on initial interaction
            if (introCard.style.opacity !== '0') {
                setTimeout(() => {
                    introCard.style.opacity = '0';
                    introCard.style.transform = 'scale(0.95)';
                }, 4000);
            }

            // Hide ending message when moving
            endingCard.style.opacity = '0';
            endingCard.style.transform = 'translateY(1rem)';
        }

        window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updatePointer(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                mouse.x = mouse.targetX = mouse.dwellX = e.touches[0].clientX;
                mouse.y = mouse.targetY = mouse.dwellY = e.touches[0].clientY;
                mouse.dwellTime = 0;
                updatePointer(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        function initBackgroundElements() {
            dustParticles.length = 0;
            fireflies.length = 0;

            const dustCount = Math.floor((width * height) / 14000);
            for (let i = 0; i < dustCount; i++) {
                dustParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.4 + 0.3,
                    alpha: Math.random() * 0.35 + 0.1,
                    vx: (Math.random() - 0.5) * 0.15,
                    vy: (Math.random() - 0.5) * 0.15
                });
            }

            const fireflyCount = Math.floor((width * height) / 38000) + 5;
            for (let i = 0; i < fireflyCount; i++) {
                fireflies.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    size: Math.random() * 2 + 1,
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.02 + 0.01
                });
            }
        }

        class GrassBlade {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.height = Math.random() * 20 + 15;
                this.maxHeight = this.height;
                this.currentHeight = 0;
                this.lean = (Math.random() - 0.5) * 12;
                this.swaySpeed = Math.random() * 0.002 + 0.001;
                this.swayOffset = Math.random() * Math.PI * 2;
                this.color = Math.random() < 0.6 ? '#22c55e' : '#4ade80';
                this.glow = 'rgba(74, 222, 128, 0.25)';
            }

            update(dt) {
                if (this.currentHeight < this.maxHeight) {
                    this.currentHeight += dt * 0.03;
                }
                this.swayOffset += this.swaySpeed * dt;
            }

            draw() {
                const currentLean = this.lean + Math.sin(this.swayOffset) * 5 + wind.x * (this.currentHeight / 30) * 8;
                const tipX = this.x + currentLean;
                const tipY = this.y - this.currentHeight;

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.x - 1.5, this.y);
                ctx.quadraticCurveTo(this.x, this.y - this.currentHeight * 0.5, tipX, tipY);
                ctx.quadraticCurveTo(this.x + 1.5, this.y - this.currentHeight * 0.5, this.x + 1.5, this.y);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Seed {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.age = 0; // ms
                this.roots = [];
                this.bloomed = false;

                const rootCount = Math.floor(Math.random() * 3) + 3;
                for (let i = 0; i < rootCount; i++) {
                    const angle = Math.PI / 2 + (Math.random() - 0.5) * 1.1;
                    const length = Math.random() * 20 + 15;
                    this.roots.push({ angle, length, progress: 0 });
                }
            }

            update(dt) {
                this.age += dt;

                // Underground root expansion
                if (this.age > 300 && this.age < 800) {
                    const prog = (this.age - 300) / 500;
                    this.roots.forEach(r => r.progress = r.length * Math.min(1, prog));
                }

                // Sprout flower at 1000ms stillness completion
                if (this.age >= 1000 && !this.bloomed) {
                    this.bloomed = true;
                    flowers.push(new Flower(this.x, this.y));
                }
            }

            draw() {
                ctx.save();
                const pulse = Math.sin(this.age * 0.008) * 0.25 + 0.75;

                // Draw underground roots
                if (this.roots[0].progress > 0) {
                    ctx.strokeStyle = 'rgba(134, 239, 172, 0.45)';
                    ctx.lineWidth = 1.2;
                    this.roots.forEach(r => {
                        ctx.beginPath();
                        ctx.moveTo(this.x, this.y);
                        const rx = this.x + Math.cos(r.angle) * r.progress;
                        const ry = this.y + Math.sin(r.angle) * r.progress;
                        ctx.lineTo(rx, ry);
                        ctx.stroke();
                    });
                }

                // Glowing seed pulse
                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 10 * pulse);
                grad.addColorStop(0, 'rgba(187, 247, 208, 0.95)');
                grad.addColorStop(0.5, 'rgba(134, 239, 172, 0.4)');
                grad.addColorStop(1, 'rgba(134, 239, 172, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 10 * pulse, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Flower {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.targetHeight = Math.random() * 80 + 80;
                this.bloomProgress = 0; // 0 to 1 over 2 seconds
                this.swayOffset = Math.random() * Math.PI * 2;
                this.swaySpeed = Math.random() * 0.0015 + 0.0008;

                // Procedural attributes
                this.palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
                this.petalCount = Math.floor(Math.random() * 5) + 6; // 6 to 10 petals
                this.maxBloomRadius = Math.random() * 12 + 18;
                this.rotation = Math.random() * Math.PI * 2;
                this.stemCurvature = (Math.random() - 0.5) * 25;

                this.petals = [];
                for (let i = 0; i < this.petalCount; i++) {
                    this.petals.push({ angle: (i / this.petalCount) * Math.PI * 2, intact: true });
                }

                this.shake = 0;
                playChime();
            }

            update(dt) {
                // Growth phase over 2000 ms
                if (this.bloomProgress < 1) {
                    this.bloomProgress = Math.min(1, this.bloomProgress + dt / 2000);
                }

                this.swayOffset += this.swaySpeed * dt;
                this.shake *= 0.9;
            }

            draw() {
                const currentHeight = this.targetHeight * this.bloomProgress;
                const sway = Math.sin(this.swayOffset) * 6 + wind.x * (currentHeight / 90) * 14 + (Math.random() - 0.5) * this.shake;

                const topX = this.x + sway + this.stemCurvature * (currentHeight / this.targetHeight);
                const topY = this.y - currentHeight;

                this.headX = topX;
                this.headY = topY;

                ctx.save();

                // Stem Base Glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(74, 222, 128, 0.2)';
                ctx.fill();

                // Stem Curve
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                const ctrlX = this.x + sway * 0.5 + this.stemCurvature;
                const ctrlY = this.y - currentHeight * 0.5;
                ctx.quadraticCurveTo(ctrlX, ctrlY, topX, topY);
                ctx.strokeStyle = '#4ade80';
                ctx.lineWidth = 2.4;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Leaves unfolding
                if (this.bloomProgress > 0.3) {
                    const leafProgress = Math.min(1, (this.bloomProgress - 0.3) / 0.7);
                    const leafY = this.y - currentHeight * 0.45;
                    const leafX = this.x + (topX - this.x) * 0.45;

                    ctx.fillStyle = '#22c55e';
                    ctx.beginPath();
                    ctx.ellipse(leafX + 7 * leafProgress, leafY, 9 * leafProgress, 3.8 * leafProgress, Math.PI / 4 + wind.x * 0.05, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.ellipse(leafX - 7 * leafProgress, leafY - 8, 8 * leafProgress, 3.2 * leafProgress, -Math.PI / 4 + wind.x * 0.05, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Flower Head & Petals
                if (this.bloomProgress > 0.4) {
                    const petalScale = (this.bloomProgress - 0.4) / 0.6;
                    const radius = this.maxBloomRadius * petalScale;

                    ctx.save();
                    ctx.translate(topX, topY);
                    ctx.rotate(this.rotation + wind.x * 0.03);

                    // Soft aura
                    ctx.shadowBlur = 16;
                    ctx.shadowColor = this.palette.glow;

                    // Petal shapes
                    this.petals.forEach(p => {
                        if (!p.intact) return;

                        ctx.save();
                        ctx.rotate(p.angle);

                        const petalGrad = ctx.createLinearGradient(0, 0, 0, radius);
                        petalGrad.addColorStop(0, this.palette.secondary);
                        petalGrad.addColorStop(1, this.palette.primary);

                        ctx.fillStyle = petalGrad;
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.quadraticCurveTo(radius * 0.4, radius * 0.5, 0, radius);
                        ctx.quadraticCurveTo(-radius * 0.4, radius * 0.5, 0, 0);
                        ctx.fill();

                        ctx.restore();
                    });

                    // Center disk
                    ctx.shadowBlur = 0;
                    const centerGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius * 0.35);
                    centerGrad.addColorStop(0, '#fef08a');
                    centerGrad.addColorStop(1, '#f59e0b');

                    ctx.fillStyle = centerGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, radius * 0.3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }

                ctx.restore();
            }

            shedPetal() {
                const intactPetals = this.petals.filter(p => p.intact);
                if (intactPetals.length > 2) {
                    const target = intactPetals[Math.floor(Math.random() * intactPetals.length)];
                    target.intact = false;

                    petals.push(new Petal(
                        this.headX || this.x,
                        this.headY || (this.y - this.targetHeight),
                        this.palette
                    ));
                }
            }
        }

        class Butterfly {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.targetX = this.x;
                this.targetY = this.y;
                this.vx = 0;
                this.vy = 0;
                this.wingAngle = 0;
                this.wingSpeed = 0.16;
                this.color = Math.random() < 0.5 ? '#e9d5ff' : '#fbcfe8';
                this.restingOn = null;
                this.restTimer = 0;
            }

            update(dt) {
                this.wingAngle += this.wingSpeed;

                // Flee from strong wind
                if (Math.abs(wind.x) > 1.8) {
                    this.restingOn = null;
                    this.vx += wind.x * 0.5;
                    this.vy -= 0.6;
                }

                if (this.restingOn) {
                    this.x = this.restingOn.headX;
                    this.y = this.restingOn.headY - 6;
                    this.restTimer -= dt;
                    this.wingSpeed = 0.04;

                    if (this.restTimer <= 0) {
                        this.restingOn = null;
                    }
                } else {
                    this.wingSpeed = 0.22;

                    // Choose next target flower or wandering point
                    if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < 25 || Math.random() < 0.008) {
                        if (flowers.length > 0 && Math.random() < 0.75) {
                            const mature = flowers.filter(f => f.bloomProgress >= 0.8);
                            if (mature.length > 0) {
                                const targetFlower = mature[Math.floor(Math.random() * mature.length)];
                                this.targetX = targetFlower.headX;
                                this.targetY = targetFlower.headY - 6;

                                if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < 18) {
                                    this.restingOn = targetFlower;
                                    this.restTimer = Math.random() * 3500 + 2000;
                                }
                            }
                        } else {
                            this.targetX = Math.random() * (width - 100) + 50;
                            this.targetY = Math.random() * (height - 200) + 100;
                        }
                    }

                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    this.vx += dx * 0.0009;
                    this.vy += dy * 0.0009;

                    this.vx *= 0.94;
                    this.vy *= 0.94;

                    this.x += this.vx;
                    this.y += this.vy;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                const flap = Math.sin(this.wingAngle);
                ctx.scale(flap, 1);

                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;

                // Left wing
                ctx.beginPath();
                ctx.ellipse(-5, -3, 7, 4, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

                // Right wing
                ctx.beginPath();
                ctx.ellipse(5, -3, 7, 4, -Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Petal {
            constructor(x, y, palette) {
                this.x = x;
                this.y = y;
                this.palette = palette;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = Math.random() * 0.6 + 0.4;
                this.rotation = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.04;
                this.alpha = 1;
            }

            update() {
                this.x += this.vx + wind.x * 0.6;
                this.y += this.vy;
                this.rotation += this.vRot;

                if (this.y > height - 20) {
                    this.alpha -= 0.01;
                }
            }

            draw() {
                if (this.alpha <= 0) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = Math.max(0, this.alpha);

                ctx.fillStyle = this.palette.primary;
                ctx.beginPath();
                ctx.ellipse(0, 0, 5.5, 2.8, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        let lastTime = performance.now();

        function updateEcosystem(dt) {
            // Smooth mouse motion easing
            mouse.vx = (mouse.targetX - mouse.x) * 0.15;
            mouse.vy = (mouse.targetY - mouse.y) * 0.15;

            mouse.px = mouse.x;
            mouse.py = mouse.y;
            mouse.x += mouse.vx;
            mouse.y += mouse.vy;

            const moveDist = Math.hypot(mouse.x - mouse.px, mouse.y - mouse.py);
            mouse.speed = moveDist;

            // 1. FAST MOVEMENT (> 12px speed) -> Wind, scattering, perturbation
            if (mouse.speed > 12) {
                wind.targetX = (mouse.vx / mouse.speed) * Math.min(mouse.speed * 0.25, 10);
                wind.force = Math.min(1.0, wind.force + 0.2);

                flowers.forEach(f => {
                    f.shake = Math.min(12, f.shake + 3);
                    if (Math.random() < 0.1) f.shedPetal();
                });

                // Reset dwell timer
                mouse.dwellX = mouse.x;
                mouse.dwellY = mouse.y;
                mouse.dwellTime = 0;
            } 
            // 2. SLOW MOVEMENT (1px to 10px speed) -> Glowing grass patches sprout
            else if (mouse.speed > 0.8 && mouse.speed <= 10) {
                // Density proportional to slowness
                const density = (10 - mouse.speed) / 10;
                if (Math.random() < density * 0.4) {
                    grassBlades.push(new GrassBlade(
                        mouse.x + (Math.random() - 0.5) * 20,
                        mouse.y + (Math.random() - 0.5) * 20
                    ));
                }

                // Reset dwell timer if moved outside small radius
                if (Math.hypot(mouse.x - mouse.dwellX, mouse.y - mouse.dwellY) > 20) {
                    mouse.dwellX = mouse.x;
                    mouse.dwellY = mouse.y;
                    mouse.dwellTime = 0;
                }
            } 
            // 3. STAY STILL (within 20px radius for 1 second / 1000ms)
            else if (mouse.speed <= 0.8 && mouse.hasStarted) {
                mouse.dwellTime += dt;
                if (mouse.dwellTime >= 1000) {
                    mouse.dwellTime = -1200; // Reset with cooldown to prevent crowding

                    const spaceOccupied = flowers.some(f => Math.hypot(f.x - mouse.dwellX, f.y - mouse.dwellY) < 35);
                    if (!spaceOccupied) {
                        seeds.push(new Seed(mouse.dwellX, mouse.dwellY));
                    }
                }
            }

            // Smooth wind force dissipation
            wind.x += (wind.targetX - wind.x) * 0.05;
            wind.targetX *= 0.92;

            // 4. Update Seeds
            for (let i = seeds.length - 1; i >= 0; i--) {
                seeds[i].update(dt);
                if (seeds[i].bloomed) seeds.splice(i, 1);
            }

            // 5. Update Flowers & Grass
            grassBlades.forEach(g => g.update(dt));
            flowers.forEach(f => f.update(dt));

            // Limit grass blades max count for frame rate performance
            if (grassBlades.length > 350) grassBlades.splice(0, grassBlades.length - 350);

            // 6. Butterfly Spawning Thresholds (8 and 15 flowers)
            const matureFlowers = flowers.filter(f => f.bloomProgress >= 0.8);
            if (matureFlowers.length >= 8 && butterflies.length < 1) {
                butterflies.push(new Butterfly());
            } else if (matureFlowers.length >= 15 && butterflies.length < 2) {
                butterflies.push(new Butterfly());
            }
            butterflies.forEach(b => b.update(dt));

            // 7. Update Petals
            for (let i = petals.length - 1; i >= 0; i--) {
                petals[i].update();
                if (petals[i].alpha <= 0) petals.splice(i, 1);
            }

            // 8. Inactivity Detection (10 seconds of no movement -> Calm Ending State)
            if (performance.now() - mouse.lastMoveTime > 10000 && mouse.hasStarted) {
                endingCard.style.opacity = '1';
                endingCard.style.transform = 'translateY(0)';
            }
        }

        function render() {
            const now = performance.now();
            const dt = Math.min(50, now - lastTime);
            lastTime = now;

            updateEcosystem(dt);

            // Deep forest atmospheric background
            ctx.fillStyle = '#070a0d';
            ctx.fillRect(0, 0, width, height);

            // Gentle ambient radial gradient glow
            const bgGlow = ctx.createRadialGradient(width / 2, height / 2, 40, width / 2, height / 2, Math.max(width, height) * 0.75);
            bgGlow.addColorStop(0, 'rgba(15, 23, 30, 0.6)');
            bgGlow.addColorStop(1, 'rgba(7, 10, 13, 1)');
            ctx.fillStyle = bgGlow;
            ctx.fillRect(0, 0, width, height);

            // 1. Ambient Dust Particles
            ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
            dustParticles.forEach(p => {
                p.x += p.vx + wind.x * 0.1;
                p.y += p.vy;

                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // 2. Bioluminescent Fireflies
            fireflies.forEach(f => {
                f.x += f.vx + wind.x * 0.1;
                f.y += f.vy;
                f.phase += f.speed;

                if (f.x < 0) f.x = width;
                if (f.x > width) f.x = 0;
                if (f.y < 0) f.y = height;
                if (f.y > height) f.y = 0;

                const alpha = Math.sin(f.phase) * 0.35 + 0.5;

                ctx.save();
                ctx.fillStyle = `rgba(187, 247, 208, ${alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#86efac';
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 3. Render Grass Blades
            grassBlades.forEach(g => g.draw());

            // 4. Render Plant Seeds
            seeds.forEach(s => s.draw());

            // 5. Render Flowers
            flowers.forEach(f => f.draw());

            // 6. Render Butterflies
            butterflies.forEach(b => b.draw());

            // 7. Render Shed Petals
            petals.forEach(p => p.draw());

            // 8. Custom Glowing Life Cursor Orb & Trailing Sparkles
            if (mouse.hasStarted) {
                // Emit trailing particle
                if (Math.random() < 0.6) {
                    cursorParticles.push({
                        x: mouse.x + (Math.random() - 0.5) * 8,
                        y: mouse.y + (Math.random() - 0.5) * 8,
                        radius: Math.random() * 2 + 1,
                        alpha: 0.8,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3
                    });
                }

                // Render cursor trails
                for (let i = cursorParticles.length - 1; i >= 0; i--) {
                    const cp = cursorParticles[i];
                    cp.x += cp.vx;
                    cp.y += cp.vy;
                    cp.alpha -= 0.02;

                    if (cp.alpha <= 0) {
                        cursorParticles.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.fillStyle = `rgba(244, 114, 182, ${cp.alpha})`;
                    ctx.beginPath();
                    ctx.arc(cp.x, cp.y, cp.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Main Cursor Life Orb
                ctx.save();
                const isStill = mouse.speed <= 0.8;
                const orbRadius = isStill ? 16 + Math.sin(now * 0.006) * 3 : 10;

                const cursorGrad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, orbRadius);
                cursorGrad.addColorStop(0, isStill ? 'rgba(254, 240, 138, 0.95)' : 'rgba(255, 255, 255, 0.9)');
                cursorGrad.addColorStop(0.5, isStill ? 'rgba(134, 239, 172, 0.4)' : 'rgba(192, 132, 252, 0.3)');
                cursorGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = cursorGrad;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, orbRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(render);
        }

        window.onload = function () {
            initBackgroundElements();
            requestAnimationFrame(render);
        };
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yutnori 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Pre-game setup overlay (nickname / language / piece face) — populated by ui.js -->
  <div id="setup-screen"></div>

  <!-- 3D scene target: Three.js renders into this canvas, nothing else touches it -->
  <canvas id="scene-canvas"></canvas>

  <!-- Shown until the first frame renders; hidden by main.js -->
  <div id="loading-message">Loading 3D scene…</div>

  <!--
    Watchdog: if the page is still stuck on the loading message after a few
    seconds — e.g. the Three.js CDN import below never resolved — main.js's
    module code may never have run at all, so it can't report its own
    failure. This plain (non-module) script always runs and explains what
    likely went wrong instead of leaving the page silently blank.
  -->
  <script>
    window.setTimeout(function () {
      var el = document.getElementById("loading-message");
      if (el && el.style.display !== "none") {
        el.textContent =
          "Still loading… this can happen if the Three.js CDN is unreachable. Check your internet connection and the browser console, then reload.";
      }
    }, 8000);
  </script>

  <!-- HUD overlay (turn indicator, throw button, restart, mute) — populated by ui.js -->
  <div id="hud"></div>

  <!--
    Three.js is loaded from a CDN via an import map, so no bundler/build step is needed.
    Requires an internet connection; for fully offline use, download the module build
    into a local folder (e.g. assets/vendor/three.module.js) and update the path below.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <!-- Entry point; all other modules are imported from here -->
  <script type="module" src="main.js"></script>
</body>
</html>
